name: Release
# A tag X.Y.Z (no "v") on main makes the release; it must equal __version__ in src/livem/__init__.py.
#   build -> test of the install -> GitHub Release.
# GitHub only builds and tests the package (artifact "packages"). The signing key never reaches GitHub:
# the maintainer runs icenux-app-sign-upload.sh Icenux/Live-M livem X.Y.Z (~/Documents/CC/bin) on their
# computer, which downloads the artifact, signs SHA256SUMS and attaches livem_all.deb, the Arch package livem-X.Y.Z-1-any.pkg.tar.zst, SHA256SUMS and
# SHA256SUMS.asc to the release. The shared APT repository Icenux (github.com/Icenux/icenux) takes the
# package from there.
on:
  push:
    tags: ["[0-9]*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  NFPM_VERSION: "2.49.0"
  NFPM_SHA256: "2afaa5ffb5e3493402e31e7c67a5a1fb42133e3f66fc315ca0051934125561c7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - name: Package
        run: bash packaging/package.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/release/
          if-no-files-found: error

  test-install:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04", "debian:12"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: rel
      - name: Install the package
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "$PWD/rel/livem_all.deb"
          test -f /etc/apt/sources.list.d/icenux.list
          test -f /usr/share/keyrings/icenux.asc
      - name: livem runs
        run: |
          out=$(livem --version)
          echo "$out"
          test "$out" = "livem ${GITHUB_REF_NAME}"

  test-install-arch:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: rel
      - name: Install the package
        run: |
          pacman -Syu --noconfirm
          pacman -U --noconfirm "$PWD"/rel/livem-*-any.pkg.tar.zst
      - name: livem runs
        run: |
          out=$(livem --version)
          echo "$out"
          test "$out" = "livem ${GITHUB_REF_NAME}"

  release:
    needs: [test-install, test-install-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release
        run: gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Live-M $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Notify the Icenux site
        # The site (Icenux/icenux.github.io) rebuilds on this event and picks up the new version.
        continue-on-error: true
        run: gh api repos/Icenux/icenux.github.io/dispatches -f event_type=app-released
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
