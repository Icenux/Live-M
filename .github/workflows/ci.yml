name: CI
# Tests and a smoke test of the installed package on every PR and push to main.
# Python 3.8 is the minimum declared in pyproject.toml, so it is tested too.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  test:
    name: python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.8",  os: ubuntu-22.04 }   # newer runner images no longer ship 3.8
          - { python: "3.10", os: ubuntu-latest }
          - { python: "3.12", os: ubuntu-latest }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Byte-compile (syntax check on this Python version)
        run: python -m compileall -q src tests tools
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test of the installed package
        run: |
          cd "$RUNNER_TEMP"   # not the repo dir, so the installed copy is imported
          livem --version
          livem --help | grep -- --procs
          python -c "import livem.procs as p; assert p.read_all(), 'no processes read'"
